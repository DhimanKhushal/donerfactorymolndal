<svg width="1600" height="320" viewBox="0 0 1600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wordmarkWhite" x1="0" y1="32" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E9E7E2"/>
    </linearGradient>
    <linearGradient id="wordmarkRed" x1="0" y1="24" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5E72"/>
      <stop offset="0.45" stop-color="#FF304E"/>
      <stop offset="1" stop-color="#D41029"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <text x="40" y="240" fill="url(#wordmarkWhite)" font-family="Arial Black, Inter, sans-serif" font-size="170" font-weight="900" letter-spacing="2">D</text>
    <g transform="translate(165 36)">
      <circle cx="72" cy="118" r="65" fill="url(#wordmarkRed)"/>
      <circle cx="72" cy="118" r="31" fill="#9D0E1D" fill-opacity="0.4"/>
      <ellipse cx="49" cy="18" rx="12" ry="12" fill="#FF5A70"/>
      <ellipse cx="95" cy="18" rx="12" ry="12" fill="#FF5A70"/>
    </g>
    <text x="286" y="240" fill="url(#wordmarkWhite)" font-family="Arial Black, Inter, sans-serif" font-size="170" font-weight="900" letter-spacing="2">NER FACTORY</text>
  </g>
</svg>
